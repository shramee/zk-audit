schema_version: "1.1"
name: trigger-audit
description: "An explicit audit request fires the skill. The run is cut short after the skill loads."
tags: [trigger, positive, cheap]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?zk-audit\""
    min: 1
    arm: with-only
