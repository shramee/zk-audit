schema_version: "1.1"
name: proof-malleable
description: "Blind quick audit of a mixer whose replay protection keys on the proof bytes."
tags: [audit, planted, integration, foundry]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says replay protection keys on the (malleable) proof bytes instead of the nullifier, so a re-randomized proof double-spends. FAIL otherwise.
