schema_version: "1.1"
name: pos-soundness
description: "An explicit soundness-review request fires the skill."
tags: [trigger, positive, cheap]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?zk-audit\""
    min: 1
    arm: with-only
