schema_version: "1.1"
name: go-branch-skip
description: "Blind quick audit of a circuit whose quorum check is gated by a compile-time Go branch."
tags: [audit, planted, soundness, selector]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the quorum/authorization check is inside a Go branch on the compile-time slice length, so the deployed (empty) shape never emits it. FAIL otherwise.
