schema_version: "1.1"
name: input-order
description: "Blind quick audit of a mixer whose verifier input array order does not match the circuit public-witness order."
tags: [audit, planted, integration, foundry]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the contract builds the verifier input array in a different order than the circuit public-witness order (nullifier and recipient swapped). FAIL otherwise.
