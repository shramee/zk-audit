schema_version: "1.1"
name: guidance-omit
description: "A ZK question gets a guidance answer: no subagents, no output directory."
tags: [trigger, guidance, cheap]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-subagents
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
  - name: no-audit-banner
    type: regex
    pattern: "zk-audit v[0-9]|Agent Progress|## zk-audit Progress"
    match: not_contains
    arm: both
  - name: correct-guidance
    type: llm
    criteria: |
      PASS if the reply says OmitModulusCheck drops the check that the bit
      decomposition is below the field modulus, so a full-width decomposition
      can have two valid bit strings (x and x + r), and that it is safe only
      when the value is known to be small or the bits are not used to constrain
      anything. FAIL if it starts a full audit or gets the semantics wrong.
