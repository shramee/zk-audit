schema_version: "1.1"
name: neg-write-test
description: "Writing a test must not start an audit."
tags: [trigger, negative, cheap]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-subagents
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
  - name: no-audit-banner
    type: regex
    pattern: "zk-audit v[0-9]|Agent Progress|## zk-audit Progress"
    match: not_contains
    arm: both
  - name: writes-test
    type: llm
    criteria: |
      PASS if the reply contains a Go test using gnark (for example test.IsSolved
      or test.NewAssert) that exercises the split of 2^40+5 into limbs 5 and 256.
      FAIL if it runs or announces a security audit instead.
