schema_version: "1.1"
name: revenue-wrap
description: "Blind quick audit of a circuit that multiplies two 128-bit factors in the native field."
tags: [audit, planted, soundness, field-arith]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the product of the two 128-bit factors can exceed the scalar field modulus and wrap, so the published product is not the integer product. FAIL otherwise.
