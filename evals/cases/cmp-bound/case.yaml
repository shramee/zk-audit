schema_version: "1.1"
name: cmp-bound
description: "Blind quick audit of a bounded comparator used on operands that are never range-checked."
tags: [audit, planted, soundness, range]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the comparator operands are not range-checked, so the bounded comparison can be fooled by a near-field-order operand. FAIL otherwise.
