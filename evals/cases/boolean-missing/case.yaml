schema_version: "1.1"
name: boolean-missing
description: "Blind quick audit of a policy that combines flags without asserting them boolean."
tags: [audit, planted, soundness, selector]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the flags are used in boolean algebra without being constrained to {0,1}, so non-boolean witnesses grant access. FAIL otherwise.
