schema_version: "1.1"
name: limb-unchecked
description: "Blind quick audit of a limb recomposition whose high limb is not range-checked."
tags: [audit, planted, soundness, range]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the high limb is never range-checked, so the recomposed amount is unbounded. FAIL otherwise.
