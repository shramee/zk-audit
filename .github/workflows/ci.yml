name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Install bubblewrap for the PoC and recon sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-net --unshare-pid true
      - name: Offline checks (vet, unit tests, knowledge-base lint, standalone skill install)
        env:
          GOFLAGS: -mod=vendor
          GOPROXY: "off"
          ZK_AUDIT_REQUIRE_SANDBOX: "1"
        run: make check
      - name: Typed-mode tests against gnark v0.14.0 fixtures
        run: make test-types
      - name: Install Foundry for the Foundry eval PoCs
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Eval PoCs on sanitized copies of the pool and liveness-roots fixtures
        run: make eval-pocs

  versions:
    # Version support matrix (references/gnark-versions.md): the PoC
    # templates, the per-gadget harness, a Foundry test against the exported
    # Groth16 verifier and the inventory on three gnark releases. Downloads
    # gnark and, for v0.16.4, Go 1.26.8 (GOTOOLCHAIN=auto); the template runs
    # themselves are offline (GOPROXY=off).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gnark: [v0.10.0, v0.14.0, v0.16.4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Install Foundry for the exported-verifier check
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Version matrix for gnark ${{ matrix.gnark }}
        run: test/versions/run --foundry --check --out "$RUNNER_TEMP/versions" ${{ matrix.gnark }}

