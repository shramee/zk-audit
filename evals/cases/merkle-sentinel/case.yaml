schema_version: "1.1"
name: merkle-sentinel
description: "Blind quick audit of a Merkle membership circuit that accepts the empty-slot sentinel."
tags: [audit, planted, soundness, hash-merkle]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the membership check never excludes the empty/zero sentinel leaf, so an unused slot can be proven as a member. FAIL otherwise.
