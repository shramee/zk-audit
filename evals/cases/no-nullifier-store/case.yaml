schema_version: "1.1"
name: no-nullifier-store
description: "Blind quick audit of a mixer whose withdraw never records the spent nullifier."
tags: [audit, planted, integration, foundry]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the withdrawal never records the nullifier (the spent mapping is unused), so the same proof double-spends. FAIL otherwise.
