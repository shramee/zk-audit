schema_version: "1.1"
name: safe-mixer
description: "Blind quick audit of a correctly constrained mixer (nullifier stored and < R, root checked, recipient bound, input order correct). No vulnerability is expected."
tags: [audit, safe, integration, foundry]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      FAIL if any record is verdict "confirmed" or "needs_validation". PASS if the audit reports no confirmed vulnerability (noting the owner-controlled addRoot as a trust assumption is acceptable).
