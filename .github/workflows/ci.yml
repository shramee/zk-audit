name: ci

on:
  push:
  pull_request:
  schedule:
    # Weekly cheap scored audit (Mondays 07:13 UTC); only runs when the
    # ANTHROPIC_API_KEY secret is configured (see the ci-smoke job).
    - cron: "13 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to exact versions; bump them together.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.24"
          cache: false
      - name: Install bubblewrap for the PoC and recon sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-net --unshare-pid true
      - name: gofmt over every Go file (tool, scorer, fixtures, eval PoCs)
        run: make fmt-check
      - name: Offline checks (vet, unit tests, knowledge-base lint, standalone skill install)
        env:
          GOFLAGS: -mod=vendor
          GOPROXY: "off"
          ZK_AUDIT_REQUIRE_SANDBOX: "1"
        run: make check
      - name: Typed-mode tests against gnark v0.14.0 fixtures
        run: make test-types
      - name: Test coverage (tool and scorer; floor COVER_MIN)
        run: |
          make cover
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the coverage profiles
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - name: Install Foundry for the Foundry eval PoCs
        uses: foundry-rs/foundry-toolchain@v1.4.0
        with:
          version: v1.7.1
      - name: Eval PoCs on sanitized copies of every fixture (Go and Foundry, sandboxed)
        run: make eval-pocs

  plugin:
    # claude plugin validate needs the CLI only, no API key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - name: Install the Claude Code CLI (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.312
      - name: Validate the marketplace and the plugin
        run: make validate-plugin
      - name: Versions agree and the changelog is in shape
        run: make release-check

  versions:
    # Version support matrix (references/gnark-versions.md): the PoC
    # templates, the per-gadget harness, a Foundry test against the exported
    # Groth16 verifier and the inventory on three gnark releases. Downloads
    # gnark and, for v0.16.4, Go 1.26.8 (GOTOOLCHAIN=auto); the template runs
    # themselves are offline (GOPROXY=off).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gnark: [v0.10.0, v0.14.0, v0.16.4]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.24"
          cache: false
      - name: Install Foundry for the exported-verifier check
        uses: foundry-rs/foundry-toolchain@v1.4.0
        with:
          version: v1.7.1
      - name: Version matrix for gnark ${{ matrix.gnark }}
        run: test/versions/run --foundry --check --out "$RUNNER_TEMP/versions" ${{ matrix.gnark }}

  ci-smoke:
    # One tiny scored audit behind a budget cap. Runs on push to main, on the
    # weekly schedule and on manual dispatch — not on every PR. Skips (does not
    # fail) when the ANTHROPIC_API_KEY secret is absent.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Report missing secret
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY not set; skipping the scored ci-smoke audit."
      - uses: actions/setup-go@v5.5.0
        if: env.ANTHROPIC_API_KEY != ''
        with:
          go-version: "1.24"
          cache: false
      - name: Install the Claude Code CLI (pinned)
        if: env.ANTHROPIC_API_KEY != ''
        run: npm i -g @anthropic-ai/claude-code@2.1.312
      - name: Run the ci-smoke audit under a budget cap (<= 5 USD)
        if: env.ANTHROPIC_API_KEY != ''
        run: evals/run-audit --runs 1 --budget 4 ci-smoke
      - name: Upload the run results
        if: ${{ always() && env.ANTHROPIC_API_KEY != '' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ci-smoke-results
          path: evals/results
          if-no-files-found: ignore
      - name: Enforce recall > 0 and no false positives
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          set -euo pipefail
          score="$(ls -t evals/results/*/ci-smoke/run1/score.json 2>/dev/null | head -1 || true)"
          if [ -z "$score" ]; then
            echo "ci-smoke: no score.json produced" >&2
            exit 1
          fi
          python3 - "$score" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          recall = r.get("recall") or 0
          fps = len(r.get("false_positives") or [])
          print(f"ci-smoke: recall={recall} false_positives={fps}")
          if recall == 0:
              print("ci-smoke: FAIL: the smoke case found none of its planted bug", file=sys.stderr)
              sys.exit(1)
          if fps > 0:
              print("ci-smoke: FAIL: a false positive was reported", file=sys.stderr)
              sys.exit(1)
          PY
