schema_version: "1.1"
name: hint-helper
description: "Blind quick audit of a helper that returns hint outputs its callers assume are constrained."
tags: [audit, planted, soundness, hints]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the bit-decomposition helper returns hint outputs without asserting they are boolean or recompose to the input. FAIL otherwise.
