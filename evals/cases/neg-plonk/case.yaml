schema_version: "1.1"
name: neg-plonk
description: "A backend-conversion question must not start an audit."
tags: [trigger, negative, cheap]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-subagents
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
  - name: no-audit-banner
    type: regex
    pattern: "zk-audit v[0-9]|Agent Progress|## zk-audit Progress"
    match: not_contains
    arm: both
  - name: answers-correctly
    type: llm
    criteria: |
      PASS if the reply outlines the gnark API changes to move from Groth16 to PLONK (for example plonk.Setup/Prove/Verify and a KZG SRS). FAIL if it runs or announces a security audit.
