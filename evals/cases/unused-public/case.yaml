schema_version: "1.1"
name: unused-public
description: "Blind quick audit of a circuit with a public input that no constraint uses."
tags: [audit, planted, soundness, public-inputs]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the Epoch public input is unconstrained, so the proof is not bound to it (cross-epoch replay). FAIL otherwise.
