schema_version: "1.1"
name: adv-commit
description: "Blind quick audit of a gnark v0.10.0 circuit using api.Commit (affected by CVE-2024-45039/45040)."
tags: [audit, advisory, dependency]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a finding reports the pinned gnark version is affected by the Groth16 commitment advisories (CVE-2024-45039 / CVE-2024-45040) and flags the api.Commit usage. FAIL otherwise.
