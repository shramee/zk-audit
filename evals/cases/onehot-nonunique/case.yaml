schema_version: "1.1"
name: onehot-nonunique
description: "Blind quick audit of a one-hot selector whose sum is not constrained to 1."
tags: [audit, planted, soundness, selector]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the one-hot selector is not constrained to sum to 1, so several entries can be selected at once. FAIL otherwise.
