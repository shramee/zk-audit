schema_version: "1.1"
name: zero-test
description: "Blind quick audit of an inverse-based zero test that is missing a constraint."
tags: [audit, planted, soundness, field-arith]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the zero/IsZero test is missing the Value*flag == 0 constraint, so the inverse hint is forgeable and a nonzero value can be flagged as zero. FAIL otherwise.
