name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Offline checks (vet, unit tests, knowledge-base lint)
        env:
          GOFLAGS: -mod=vendor
          GOPROXY: "off"
        run: make check
      - name: Typed-mode tests against gnark v0.14.0 fixtures
        run: make test-types
      - name: Eval PoCs on a sanitized copy of the pool fixture
        run: make eval-pocs
