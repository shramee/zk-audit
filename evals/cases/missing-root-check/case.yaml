schema_version: "1.1"
name: missing-root-check
description: "Blind quick audit of a mixer that never checks the proof root is known."
tags: [audit, planted, integration, foundry]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says withdraw never checks the root against knownRoots, so a proof against an attacker-built tree is accepted. FAIL otherwise.
