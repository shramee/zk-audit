schema_version: "1.1"
name: ci-smoke
description: "The cheap CI smoke audit: one circuit with an unconstrained square-root hint output."
tags: [audit, planted, soundness, ci-smoke]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the published root is not constrained by a squaring check (RootVal*RootVal == Square), so it is a free value. FAIL otherwise.
