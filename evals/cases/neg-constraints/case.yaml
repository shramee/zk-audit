schema_version: "1.1"
name: neg-constraints
description: "Counting constraints must not start an audit."
tags: [trigger, negative, cheap]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-subagents
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
  - name: no-audit-banner
    type: regex
    pattern: "zk-audit v[0-9]|Agent Progress|## zk-audit Progress"
    match: not_contains
    arm: both
  - name: answers-correctly
    type: llm
    criteria: |
      PASS if the reply estimates the constraint count and names a dominant component (for example the MiMC hashing or range checks). FAIL if it runs or announces a security audit.
