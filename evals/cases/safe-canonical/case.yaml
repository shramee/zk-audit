schema_version: "1.1"
name: safe-canonical
description: "Blind quick audit of A full-width decomposition with the default canonical (< r) check (the correct counterpart of omit-modulus). No finding is expected."
tags: [audit, safe, soundness]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      FAIL if any record is verdict "confirmed" or "needs_validation" (the circuit is correctly constrained). PASS if the audit reports no confirmed vulnerability (hardening notes are acceptable).
