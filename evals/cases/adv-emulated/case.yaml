schema_version: "1.1"
name: adv-emulated
description: "Blind quick audit of a gnark v0.16.1 circuit using std/math/emulated (affected by GHSA-3mvx; needs Go 1.25.7+)."
tags: [audit, advisory, dependency]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a finding reports the pinned gnark version is affected by the emulated-arithmetic advisory (GHSA-3mvx) and flags the emulated multiplication. FAIL otherwise.
