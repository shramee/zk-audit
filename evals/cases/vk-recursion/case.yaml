schema_version: "1.1"
name: vk-recursion
description: "Blind quick audit of an in-circuit Groth16 verifier whose verifying key is an unbound witness."
tags: [audit, planted, soundness, commitments-recursion]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the inner verifying key is a free witness not bound to a trusted key, so a prover can verify against a key of their own circuit. FAIL otherwise.
