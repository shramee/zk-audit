schema_version: "1.1"
name: cross-domain-replay
description: "Blind quick audit of a mixer whose proof statement omits the chain id and contract address."
tags: [audit, planted, integration, foundry]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the proof is not bound to the chain or contract, so a proof replays across deployments sharing the verifier and root. FAIL otherwise.
