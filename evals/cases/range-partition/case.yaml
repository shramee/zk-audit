schema_version: "1.1"
name: range-partition
description: "Blind quick audit of a value split whose low part range overlaps the high part."
tags: [audit, planted, soundness, range]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the low part is range-checked too loosely and overlaps the high part, so the split is non-unique and the high part is prover-chosen. FAIL otherwise.
