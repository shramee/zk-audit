schema_version: "1.1"
name: hint-remainder
description: "Blind quick audit of a Euclidean-division hint whose remainder is not range-bounded."
tags: [audit, planted, soundness, hints]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the division remainder is not constrained to [0, divisor), so the published quotient is not unique. FAIL otherwise.
