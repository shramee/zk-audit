schema_version: "1.1"
name: guidance-merkle
description: "A Merkle-binding question gets a guidance answer, no audit."
tags: [trigger, guidance, cheap]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-subagents
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
  - name: no-audit-banner
    type: regex
    pattern: "zk-audit v[0-9]|Agent Progress|## zk-audit Progress"
    match: not_contains
    arm: both
  - name: answers-correctly
    type: llm
    criteria: |
      PASS if the reply explains that the path direction/index bits must drive the left/right ordering at each level (and be constrained boolean), so the leaf is bound to its position. FAIL if it starts a full audit or gets it wrong.
