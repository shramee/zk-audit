schema_version: "1.1"
name: nonbool-mux
description: "Blind quick audit of a hand-rolled mux whose selector is not constrained boolean."
tags: [audit, planted, soundness, selector]
plugins: ["../../../plugins/zk-audit"]
runs: 3
context:
  scaffold_script: scaffold.sh
graders:
  - name: findings-written
    type: regex
    target: {source: file, path: out/findings.json}
    pattern: '"schema_version":\s*"1"'
  - name: report-rendered
    type: regex
    target: {source: file, path: out/REPORT.md}
    pattern: '(?:Coverage|coverage)'
  - name: planted-bug-found
    type: llm
    weight: 3
    focus: {source: file, path: out/findings.json}
    criteria: |
      PASS if a confirmed finding says the mux selector is not constrained to {0,1}, so the output can be an arbitrary combination of the two lanes. FAIL otherwise.
